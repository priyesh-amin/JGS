name: Sync Content & Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync_content]

permissions:
  contents: write
  deployments: write

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 python-dotenv

      - name: Sync Old Website Sign-ups
        env:
          SCRAPE_USERNAME: ${{ secrets.SCRAPE_USERNAME }}
          SCRAPE_PASSWORD: ${{ secrets.SCRAPE_PASSWORD }}
        run: python scripts/sync_old_site.py || echo "Old site sync failed, continuing..."

      - name: Sync Google Sheets Data
        run: python scripts/sync_google_sheets.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Check approved content files for changes
        id: git_check
        run: |
          if git diff --quiet -- \
            src/data/fixtures.json \
            src/data/leaderboards.json \
            src/data/metadata.json \
            src/data/signups.json; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Changes
        if: steps.git_check.outputs.changes == 'true'
        run: |
          git config --global user.name 'JGS Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/data/fixtures.json \
            src/data/leaderboards.json \
            src/data/metadata.json \
            src/data/signups.json
          git commit -m "Auto-Sync: Updated content from Google Sheets"
          git push

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GH_PAT }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=jaguargolfsociety --branch=main
