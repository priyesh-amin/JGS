name: JGS Pull Request Check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'functions/**'
      - 'migrations/**'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-release-workflow.mjs'
      - 'vite.config.*'

permissions:
  contents: read

concurrency:
  group: jgs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check
