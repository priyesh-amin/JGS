name: Deploy JGS Application

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-application.yml'
      - 'functions/**'
      - 'migrations/**'
      - 'scripts/apply-management-migration.mjs'
      - 'scripts/retire-legacy-schedule.mjs'
      - 'public/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Apply additive management schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-management-migration.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GH_PAT }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=jaguargolfsociety --branch=main

      - name: Retire spreadsheet schedule after cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/retire-legacy-schedule.mjs
